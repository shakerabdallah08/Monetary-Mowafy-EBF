name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unzip newest project4 zip
        run: |
          f="$(git log -1 --name-only --pretty=format: -- '*.zip' | head -1)"
          echo "Using: $f"
          unzip -q "$f" -d proj
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mokhtar-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
